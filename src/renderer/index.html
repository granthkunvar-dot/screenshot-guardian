<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob: 'self';" />
  <title>Screenshot Guardian — Privacy Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

<!-- Custom Title Bar -->
<div class="titlebar" id="titlebar">
  <div class="titlebar-left">
    <div class="app-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a78bfa"/>
            <stop offset="100%" style="stop-color:#38bdf8"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <span class="app-name">Screenshot <span class="highlight">Guardian</span></span>
    <button class="titlebar-snip-btn" id="btn-title-snip" title="Snip Screen (Win+S / Alt+S)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>Snip (Win+S)</span>
    </button>
  </div>
  <div class="titlebar-drag-region"></div>
  <div class="titlebar-controls">
    <button class="win-btn minimize" id="btn-minimize" title="Minimize">
      <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
    </button>
    <button class="win-btn maximize" id="btn-maximize" title="Maximize">
      <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" stroke-width="1" fill="none"/></svg>
    </button>
    <button class="win-btn close" id="btn-close" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
</div>

<!-- Main App Layout -->
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">DETECTION</p>
      <div class="detector-toggles">
        <label class="toggle-item" id="toggle-password">
          <div class="toggle-icon password-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1.5"/></svg>
          </div>
          <span>Passwords & Fields</span>
          <div class="toggle-switch active" data-key="password"></div>
        </label>
        <label class="toggle-item" id="toggle-email">
          <div class="toggle-icon email-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <span>Email Addresses</span>
          <div class="toggle-switch active" data-key="email"></div>
        </label>
        <label class="toggle-item" id="toggle-phone">
          <div class="toggle-icon phone-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.18 6.18l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/></svg>
          </div>
          <span>Phone Numbers</span>
          <div class="toggle-switch active" data-key="phone"></div>
        </label>
        <label class="toggle-item" id="toggle-qr">
          <div class="toggle-icon qr-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="6" y="6" width="1" height="1" fill="currentColor"/><rect x="17" y="6" width="1" height="1" fill="currentColor"/><rect x="6" y="17" width="1" height="1" fill="currentColor"/><line x1="14" y1="14" x2="17" y2="14"/><line x1="20" y1="14" x2="20" y2="17"/><line x1="17" y1="17" x2="20" y2="17"/><line x1="14" y1="17" x2="14" y2="20"/><line x1="17" y1="20" x2="20" y2="20"/></svg>
          </div>
          <span>QR Codes</span>
          <div class="toggle-switch active" data-key="qr"></div>
        </label>
        <label class="toggle-item" id="toggle-id">
          <div class="toggle-icon id-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          </div>
          <span>Sensitive IDs</span>
          <div class="toggle-switch active" data-key="id"></div>
        </label>
        <label class="toggle-item" id="toggle-crypto">
          <div class="toggle-icon crypto-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 8h5a2 2 0 010 4H9v4m4-4h1a2 2 0 010 4H9"/></svg>
          </div>
          <span>Crypto Addresses</span>
          <div class="toggle-switch active" data-key="crypto"></div>
        </label>
        <label class="toggle-item" id="toggle-ip">
          <div class="toggle-icon ip-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          </div>
          <span>IP Addresses</span>
          <div class="toggle-switch active" data-key="ip"></div>
        </label>
      </div>
    </div>

    <div class="sidebar-section">
      <p class="sidebar-label">BLUR STYLE</p>
      <div class="blur-options">
        <button class="blur-opt active" data-blur="pixelate" title="Pixelate">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="0" y="0" width="8" height="8" rx="1" fill="currentColor" opacity="0.4"/><rect x="10" y="0" width="8" height="8" rx="1" fill="currentColor" opacity="0.7"/><rect x="0" y="10" width="8" height="8" rx="1" fill="currentColor" opacity="0.7"/><rect x="10" y="10" width="8" height="8" rx="1" fill="currentColor" opacity="0.4"/></svg>
          Pixelate
        </button>
        <button class="blur-opt" data-blur="blackbar" title="Black Bar">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="0" y="6" width="18" height="6" rx="1" fill="currentColor"/></svg>
          Black Bar
        </button>
        <button class="blur-opt" data-blur="blur" title="Gaussian Blur">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" fill="currentColor" opacity="0.2"/><circle cx="9" cy="9" r="4" fill="currentColor" opacity="0.4"/><circle cx="9" cy="9" r="2" fill="currentColor" opacity="0.8"/></svg>
          Gaussian
        </button>
      </div>
    </div>

    <div class="sidebar-section">
      <p class="sidebar-label">RISK SUMMARY</p>
      <div class="risk-meter-wrap">
        <div class="risk-meter">
          <div class="risk-fill" id="risk-fill"></div>
        </div>
        <div class="risk-label" id="risk-label">No image loaded</div>
      </div>
      <div class="finding-counts" id="finding-counts"></div>
    </div>
  </aside>

  <!-- Main Panel -->
  <main class="main-panel">

    <!-- Drop Zone -->
    <div class="dropzone" id="dropzone">
      <div class="drop-content">
        <div class="drop-icon-wrap">
          <div class="drop-icon-ring"></div>
          <svg class="drop-icon" width="52" height="52" viewBox="0 0 52 52" fill="none">
            <path d="M26 6L10 22h10v16h12V22h10L26 6z" fill="url(#dg)"/>
            <path d="M8 40h36" stroke="url(#dg)" stroke-width="3" stroke-linecap="round"/>
            <defs>
              <linearGradient id="dg" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#38bdf8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2 class="drop-title">Drop a Screenshot Here</h2>
        <p class="drop-subtitle">or choose how to load one</p>
        <div class="drop-actions">
          <button class="btn-primary" id="btn-snip-screen" title="Snip Screen (Win+S / Alt+S)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Snip Screen (Win+S)
          </button>
          <button class="btn-secondary" id="btn-open-file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            Open File
          </button>
          <button class="btn-secondary" id="btn-paste-clipboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            Paste (Ctrl+V)
          </button>
        </div>
        <p class="drop-hint">Supports PNG, JPG, BMP, WebP • Max 50MB</p>
      </div>
    </div>

    <!-- Analysis View (hidden until image loaded) -->
    <div class="analysis-view hidden" id="analysis-view">

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="tool-btn" id="btn-toolbar-snip" title="Snip new screenshot (Win+S / Alt+S)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Snip
          </button>
          <button class="tool-btn" id="btn-new-scan" title="Open or drop another image">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            New Scan
          </button>
          <div class="file-info" id="file-info"></div>
        </div>
        <div class="toolbar-right">
          <button class="tool-btn" id="btn-undo-blur" title="Undo blur (Ctrl+Z)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Undo
          </button>
          <button class="tool-btn" id="btn-auto-blur" title="Auto-blur all detected sensitive regions">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07"/></svg>
            Auto-Blur All
          </button>
          <button class="tool-btn" id="btn-copy-clipboard" title="Copy safe blurred image to clipboard (Ctrl+C)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy (Ctrl+C)
          </button>
          <button class="tool-btn accent" id="btn-save" title="Save blurred PNG to disk">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
            Save Safe Copy
          </button>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">

        <!-- Canvas Section -->
        <div class="canvas-section">
          <div class="canvas-header">
            <span class="canvas-label">Preview</span>
            <div class="canvas-controls">
              <button class="icon-btn" id="btn-zoom-out" title="Zoom Out">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
              </button>
              <span class="zoom-level" id="zoom-level">100%</span>
              <button class="icon-btn" id="btn-zoom-in" title="Zoom In">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
              </button>
              <button class="icon-btn" id="btn-zoom-reset" title="Reset Zoom">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6M4 4v6M20 20h-6M20 20v-6M4 20v-6M4 20h6M20 4h-6M20 4v6"/></svg>
              </button>
            </div>
          </div>
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="main-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
          </div>
          <div class="canvas-status" id="canvas-status">
            <div class="scan-progress hidden" id="scan-progress">
              <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
              <span id="progress-text">Scanning…</span>
            </div>
          </div>
        </div>

        <!-- Findings Panel -->
        <div class="findings-panel" id="findings-panel">
          <div class="findings-header">
            <span class="findings-title">Findings</span>
            <button class="icon-btn" id="btn-blur-all-findings">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/></svg>
              Blur All
            </button>
          </div>
          <div class="findings-list" id="findings-list">
            <div class="no-findings" id="no-findings-msg">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <p>No findings yet</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Toast notifications -->
<div class="toast-container" id="toast-container"></div>

<!-- Loading overlay -->
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner-ring"></div>
    <div class="spinner-ring inner"></div>
    <p id="loading-text">Initializing OCR engine…</p>
  </div>
</div>

<script src="../vendor/jsqr.js"></script>
<script src="scanner.js"></script>
<script src="renderer.js"></script>
</body>
</html>
